name: Verify Brain Rot gameplay
on:
  pull_request:
    branches: ['grok/rc1-smoke-fixes']
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and deterministic regression suite
        run: npx tsc --noEmit && npm test
      - name: Build with synthetic QA identity, never hosted credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          const ref = 'njqwwimzrsunheehnnnt';
          const b64 = x => Buffer.from(JSON.stringify(x)).toString('base64url');
          const key = [b64({alg:'HS256',typ:'JWT'}),b64({iss:'supabase',ref,role:'anon'}),'synthetic-invalid-signature'].join('.');
          const result = spawnSync('npm', ['run','build'], {stdio:'inherit', env:{...process.env,
            VERCEL_ENV:'preview', VERCEL_GIT_COMMIT_REF:'audit/qa-isolation-and-reliability-20261027',
            NEXT_PUBLIC_SUPABASE_URL:`https://${ref}.supabase.co`, NEXT_PUBLIC_SUPABASE_ANON_KEY:key,
            SUPABASE_PUBLIC_KEY_SHA256:createHash('sha256').update(key).digest('hex')}});
          process.exit(result.status ?? 1);
          NODE
      - name: Local Jetpack input in sandboxed Chromium
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          QA_BASE_URL: http://127.0.0.1:3137
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.64.1
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$browser"
          npm run dev -- --hostname 127.0.0.1 --port 3137 > /tmp/jetpack-controls.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 3 "$QA_BASE_URL/play/brain-rot" > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true || { cat /tmp/jetpack-controls.log; exit 1; }
          CHROMIUM_BIN="$browser" node tests/browser/jetpack-controls.qa.mjs
