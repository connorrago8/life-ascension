name: Charlie Crypt branch verification
on:
  push:
    branches:
      - charlie/crypt-inscription-bargain-031
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crypt-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crypt regression suite
        run: node --experimental-strip-types --test tests/crypt*.test.mjs
