name: Combined local progress integration verification
on:
  pull_request:
    branches: ['integration/release-evidence-20261104']
permissions:
  contents: read
jobs:
  combined-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - name: Prepare synthetic QA build fixture (no hosted credentials)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          const ref = 'njqwwimzrsunheehnnnt';
          const b64 = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const key = [b64({ alg: 'HS256', typ: 'JWT' }),
            b64({ iss: 'supabase', ref, role: 'anon' }),
            'synthetic-invalid-signature'].join('.');
          const pin = createHash('sha256').update(key).digest('hex');
          appendFileSync(process.env.GITHUB_ENV, [
            'VERCEL_ENV=preview',
            // Synthetic CI-only protected-branch identity; never changes hosted routing.
            'VERCEL_GIT_COMMIT_REF=audit/qa-isolation-and-reliability-20261027',
            `NEXT_PUBLIC_SUPABASE_URL=https://${ref}.supabase.co`,
            `NEXT_PUBLIC_SUPABASE_ANON_KEY=${key}`,
            `SUPABASE_PUBLIC_KEY_SHA256=${pin}`,
            '',
          ].join('\n'));
          NODE
      - name: Production build (isolated synthetic Preview configuration)
        run: npm run build
      - name: Install ephemeral browser runner
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.64.1
      - name: Combined lifecycle, controls, town and storage-isolation browser journeys
        env:
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          QA_BASE_URL: http://127.0.0.1:3142
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          browser="$(command -v google-chrome-stable || command -v google-chrome || true)"
          test -n "$browser"
          npm run dev -- --hostname 127.0.0.1 --port 3142 > /tmp/lantern-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --fail --max-time 3 "$QA_BASE_URL/play/emberhaven" >/dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true || { cat /tmp/lantern-next.log; exit 1; }
          export CHROMIUM_BIN="$browser"
          node tests/browser/brain-rot-navigation.qa.mjs
          node tests/browser/jetpack-controls.qa.mjs
          node tests/browser/lantern-persistence.qa.mjs
          node tests/browser/local-progress-integration.qa.mjs
