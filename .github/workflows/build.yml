name: Verify application build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Prepare synthetic QA build fixture (no hosted credentials)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          const ref = 'njqwwimzrsunheehnnnt';
          const b64 = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const key = [b64({ alg: 'HS256', typ: 'JWT' }),
            b64({ iss: 'supabase', ref, role: 'anon' }),
            'synthetic-invalid-signature'].join('.');
          const pin = createHash('sha256').update(key).digest('hex');
          appendFileSync(process.env.GITHUB_ENV, [
            'VERCEL_ENV=preview',
            'VERCEL_GIT_COMMIT_REF=audit/qa-isolation-and-reliability-20261027',
            `NEXT_PUBLIC_SUPABASE_URL=https://${ref}.supabase.co`,
            `NEXT_PUBLIC_SUPABASE_ANON_KEY=${key}`,
            `SUPABASE_PUBLIC_KEY_SHA256=${pin}`,
            '',
          ].join('\n'));
          NODE
      - name: Production build (isolated synthetic Preview configuration)
        run: npm run build
      - name: Verify emitted QA browser routing (synthetic, no hosted credentials)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { createHash } from 'node:crypto';
          const qaRef = 'njqwwimzrsunheehnnnt';
          const productionRef = 'ugcvhmrriazbbymjxvch';
          const root = '.next/static'; // Only emitted browser assets, never server bundles.
          let inspected = 0;
          let qaMatches = 0;
          let productionMatches = 0;
          const digest = createHash('sha256');
          async function scan(directory) {
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              if (entry.isDirectory()) { await scan(path); continue; }
              if (!entry.isFile() || !/\.(js|mjs)$/.test(entry.name)) continue;
              const source = await readFile(path, 'utf8');
              inspected++;
              if (source.includes(productionRef)) productionMatches++;
              if (source.includes(qaRef)) {
                qaMatches++;
                // Non-secret source fingerprint; detects drift between build artifacts.
                digest.update(path).update('\0').update(source).update('\0');
              }
            }
          }
          await scan(root);
          if (productionMatches) throw new Error(
            'QA browser artifact contains Production Supabase project references');
          if (!qaMatches) throw new Error(
            'QA browser artifact contains no expected QA Supabase project reference');
          console.log('QA browser bundle routing PASS:', {
            inspected, qaMatches, productionMatches,
            sourceFingerprint: digest.digest('hex').slice(0, 16),
          });
          NODE

  sql-smoke:
    name: SQL smoke tests (isolated Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations 0001–0007 and run all five SQL smoke tests
        shell: bash
        run: |
          set -euo pipefail
          createdb life_ascension_auth_test
          db=life_ascension_auth_test
          psql -v ON_ERROR_STOP=1 -d "$db" -f tests/sql/prelude.sql
          for file in \
            supabase/migrations/202610230001_core.sql \
            supabase/migrations/202610230002_api_keys_progress.sql \
            supabase/migrations/202610230003_future_quest_scheduling.sql \
            supabase/migrations/202610230004_lifetime_xp.sql \
            supabase/migrations/202610240005_api_key_user_context.sql \
            supabase/migrations/202610240006_quest_edit_archive.sql \
            supabase/migrations/202610240007_daily_late_window.sql; do
            psql -v ON_ERROR_STOP=1 -d "$db" -f "$file"
          done
          for file in \
            tests/sql/api_keys_progress_smoke.sql \
            tests/sql/scheduling_auth_smoke.sql \
            tests/sql/two_user_mcp_auth.sql \
            tests/sql/archive_compat_smoke.sql \
            tests/sql/daily_late_window_smoke.sql; do
            psql -v ON_ERROR_STOP=1 -d "$db" -f "$file"
          done
          echo "All five SQL smoke tests passed"
