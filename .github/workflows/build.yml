name: Verify application build
on:
  push:
    branches: [main, ci/quest-board-528d77d]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build

  sql-smoke:
    name: SQL smoke tests (isolated Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidate migrations and run SQL regressions
        shell: bash
        run: |
          set -euo pipefail
          createdb life_ascension_auth_test
          db=life_ascension_auth_test
          psql -v ON_ERROR_STOP=1 -d "$db" -f tests/sql/prelude.sql
          for file in \
            supabase/migrations/202610230001_core.sql \
            supabase/migrations/202610230002_api_keys_progress.sql \
            supabase/migrations/202610230003_future_quest_scheduling.sql \
            supabase/migrations/202610230004_lifetime_xp.sql \
            supabase/migrations/202610240005_api_key_user_context.sql \
            supabase/migrations/202610240006_quest_edit_archive.sql \
            supabase/migrations/202610240007_daily_late_window.sql \
            supabase/migrations/20261027225625_quest_board_classification.sql \
            supabase/migrations/20261028002427_quest_board_recurrence_receipts.sql; do
            psql -v ON_ERROR_STOP=1 -d "$db" -f "$file"
          done
          for file in \
            tests/sql/api_keys_progress_smoke.sql \
            tests/sql/scheduling_auth_smoke.sql \
            tests/sql/two_user_mcp_auth.sql \
            tests/sql/archive_compat_smoke.sql \
            tests/sql/daily_late_window_smoke.sql \
            tests/sql/quest_classification_smoke.sql \
            tests/sql/quest_board_m1_smoke.sql; do
            psql -v ON_ERROR_STOP=1 -d "$db" -f "$file"
          done
          mkdir -p artifacts/concurrency
          bash tests/sql/quest_receipt_v2_concurrency.sh | tee artifacts/concurrency/candidate-test.log
          export PGDATABASE="$db"
          bash tests/evidence/release-verification/prove-overlap.sh | tee artifacts/concurrency/overlap-test.log
          echo "Candidate SQL regressions passed"
      - name: Upload concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-${{ github.sha }}
          path: artifacts/concurrency/
          if-no-files-found: warn
