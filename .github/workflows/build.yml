name: Verify application build
on:
  push:
    branches: [main, charlie/belt-static-mobile-qa, charlie/l1-l5-helmet-renderer-qa-20261027]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build

  sql-smoke:
    name: SQL smoke tests (isolated Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations 0001–0007 and run all five SQL smoke tests
        shell: bash
        run: |
          set -euo pipefail
          createdb life_ascension_auth_test
          db=life_ascension_auth_test
          psql -v ON_ERROR_STOP=1 -d "$db" -f tests/sql/prelude.sql
          for file in \
            supabase/migrations/202610230001_core.sql \
            supabase/migrations/202610230002_api_keys_progress.sql \
            supabase/migrations/202610230003_future_quest_scheduling.sql \
            supabase/migrations/202610230004_lifetime_xp.sql \
            supabase/migrations/202610240005_api_key_user_context.sql \
            supabase/migrations/202610240006_quest_edit_archive.sql \
            supabase/migrations/202610240007_daily_late_window.sql; do
            psql -v ON_ERROR_STOP=1 -d "$db" -f "$file"
          done
          for file in \
            tests/sql/api_keys_progress_smoke.sql \
            tests/sql/scheduling_auth_smoke.sql \
            tests/sql/two_user_mcp_auth.sql \
            tests/sql/archive_compat_smoke.sql \
            tests/sql/daily_late_window_smoke.sql; do
            psql -v ON_ERROR_STOP=1 -d "$db" -f "$file"
          done
          echo "All five SQL smoke tests passed"

  belt-mobile-qa:
    name: Belt visual QA (sandboxed, static, 16 screenshots)
    if: github.event_name == 'push' && github.ref == 'refs/heads/charlie/belt-static-mobile-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no hosted services)
        run: npm install --no-audit --no-fund
      - name: Capture and attest 16 belt comparisons using Chromium sandbox
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0 || { echo "ERROR: refusing root browser capture"; exit 1; }
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$browser" || { echo "ERROR: sandboxed Chromium/Chrome unavailable"; exit 1; }
          CHROMIUM_BIN="$browser" node scripts/run-belt-mobile-qa-unprivileged.mjs artifacts/belt-mobile-qa
      - name: Upload screenshot evidence for CEO/Charlie review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: belt-mobile-qa-${{ github.sha }}
          path: artifacts/belt-mobile-qa/
          if-no-files-found: warn
          retention-days: 7

  helmet-mobile-qa:
    name: Helmet visual QA (sandboxed, static, 8 screenshots)
    if: github.event_name == 'push' && github.ref == 'refs/heads/charlie/l1-l5-helmet-renderer-qa-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (mock-only, no hosted services)
        run: npm install --no-audit --no-fund
      - name: Capture actual Chromium screenshots (sandbox required)
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0 || { echo 'ERROR: refusing root browser'; exit 1; }
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$browser" || { echo 'ERROR: sandboxed Chromium unavailable'; exit 1; }
          CHROMIUM_BIN="$browser" node scripts/generate-helmet-mobile-qa.mjs artifacts/helmet-mobile-qa --capture
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {readFile,writeFile} from "node:fs/promises";
            import {createHash} from "node:crypto";
            const dir="artifacts/helmet-mobile-qa";
            const manifest=JSON.parse(await readFile(dir+"/manifest.json","utf8"));
            assert.equal(manifest.files.length,8);
            assert.equal(manifest.browserScreenshotsCaptured,true);
            const captures=[];
            for(const item of manifest.files){
              const f=item.png;
              assert.ok(f && f.startsWith("helmet-"));
              const b=await readFile(dir+"/"+f);
              assert.equal(b.readUInt32BE(16),item.width);
              assert.ok(b.readUInt32BE(20)>=380);
              captures.push({file:f,width:item.width,height:b.readUInt32BE(20),sha256:createHash("sha256").update(b).digest("hex")});
            }
            await writeFile(dir+"/sha256-evidence.json",JSON.stringify({sourceCommit:process.env.GITHUB_SHA,visualMode:"static-proposed-not-owned",screenshots:captures},null,2)+"\\n");
          '
      - name: Upload immutable helmet QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helmet-mobile-qa-${{ github.sha }}
          path: artifacts/helmet-mobile-qa/
          if-no-files-found: warn
          retention-days: 7
