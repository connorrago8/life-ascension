name: Verify application build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build

  sql-smoke:
    name: SQL smoke tests (isolated Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations 0001–0007 and run SQL smoke tests
        shell: bash
        run: |
          set -euo pipefail
          createdb life_ascension_auth_test
          db=life_ascension_auth_test
          psql -v ON_ERROR_STOP=1 -d "$db" -f tests/sql/prelude.sql
          for file in \
            supabase/migrations/202610230001_core.sql \
            supabase/migrations/202610230002_api_keys_progress.sql \
            supabase/migrations/202610230003_future_quest_scheduling.sql \
            supabase/migrations/202610230004_lifetime_xp.sql \
            supabase/migrations/202610240005_api_key_user_context.sql \
            supabase/migrations/202610240006_quest_edit_archive.sql \
            supabase/migrations/202610240007_daily_late_window.sql \
            supabase/migrations/202610270001_quest_receipt_v2.sql; do
            psql -v ON_ERROR_STOP=1 -d "$db" -f "$file"
          done
          for file in \
            tests/sql/api_keys_progress_smoke.sql \
            tests/sql/scheduling_auth_smoke.sql \
            tests/sql/two_user_mcp_auth.sql \
            tests/sql/archive_compat_smoke.sql \
            tests/sql/daily_late_window_smoke.sql \
            tests/sql/quest_receipt_v2_smoke.sql; do
            psql -v ON_ERROR_STOP=1 -d "$db" -f "$file"
          done
          bash tests/sql/quest_receipt_v2_concurrency.sh
          echo "All SQL smoke tests passed"

  sql-combined:
    name: Combined PR21 + PR31 SQL (disposable Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Pin existing PR21 progress contract (fail closed if head changes)
        shell: bash
        run: |
          set -euo pipefail
          expected=60dc6eb02de41cf33d23e198eaafcb29a1434e36
          git fetch --no-tags --depth=1 origin feature/partial-progress-phase1
          actual="$(git rev-parse FETCH_HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::PR21 head moved; re-review and update combined test pin"
            exit 1
          fi
          git worktree add --detach "$RUNNER_TEMP/partial-progress" "$expected"
          echo "Pinned PR21 $actual; PR31 checkout $(git rev-parse HEAD)"
      - name: Apply 0001-0012 then v2; verify combined XP, clear, ownership and concurrency
        shell: bash
        run: |
          set -euo pipefail
          progress="$RUNNER_TEMP/partial-progress"
          db=life_ascension_auth_test
          createdb "$db"
          psql -v ON_ERROR_STOP=1 -d "$db" -f "$progress/tests/sql/prelude.sql"
          for file in \
            "$progress/supabase/migrations/202610230001_core.sql" \
            "$progress/supabase/migrations/202610230002_api_keys_progress.sql" \
            "$progress/supabase/migrations/202610230003_future_quest_scheduling.sql" \
            "$progress/supabase/migrations/202610230004_lifetime_xp.sql" \
            "$progress/supabase/migrations/202610240005_api_key_user_context.sql" \
            "$progress/supabase/migrations/202610240006_quest_edit_archive.sql" \
            "$progress/supabase/migrations/202610240007_daily_late_window.sql" \
            "$progress/supabase/migrations/202610260008_partial_progress.sql" \
            "$progress/supabase/migrations/202610260009_progress_configuration.sql" \
            "$progress/supabase/migrations/202610260010_progress_completion_guard.sql" \
            "$progress/supabase/migrations/202610260011_atomic_tracked_creation.sql" \
            "$progress/supabase/migrations/202610260012_api_progress_wrapper.sql" \
            supabase/migrations/202610270001_quest_receipt_v2.sql; do
            if [[ "$file" == "supabase/migrations/202610270001_quest_receipt_v2.sql" ]]; then
              # Read-only compatibility gate BEFORE adding v2; fail closed on drift.
              fingerprint="$(psql -v ON_ERROR_STOP=1 -At -d "$db" -c "select md5(pg_get_functiondef('public.log_quest_progress(uuid,uuid,integer)'::regprocedure))")"
              preflight="$(psql -v ON_ERROR_STOP=1 -At -d "$db" -v expected_progress_md5="$fingerprint" -f tests/sql/qa_forward_only_preflight.sql)"
              test "$preflight" = "PASS" || { echo "::error::QA forward-only preflight failed: $preflight"; exit 1; }
              negative="$(psql -v ON_ERROR_STOP=1 -At -d "$db" -v expected_progress_md5=00000000000000000000000000000000 -f tests/sql/qa_forward_only_preflight.sql)"
              test "$negative" = "STOP" || { echo "::error::QA preflight did not fail closed on wrong fingerprint"; exit 1; }
              echo "PASS read-only QA forward-only preflight; mismatched fingerprint rejected"
            fi
            psql -v ON_ERROR_STOP=1 -d "$db" -f "$file"
          done
          psql -v ON_ERROR_STOP=1 -d "$db" -f "$progress/tests/sql/partial_progress_smoke.sql"
          psql -v ON_ERROR_STOP=1 -d "$db" -f tests/sql/quest_receipt_v2_combined_smoke.sql
          bash "$progress/tests/sql/parallel_progress.sh" "$db"
          bash tests/sql/quest_receipt_v2_concurrency.sh
          echo "PASS pinned PR21 + PR31 combined migration and regression sequence"
