<title>Live progress · LIFE ASCENSION</title>
<script>

<style>
:root {

.lp-other { color: var(--muted); margin: 12px 0; }

.lp-toast.is-in { opacity: 1; transform: none; }

.lp-lab.is-open { opacity: 1; transform: none; visibility: visible; pointer-events: auto; transition-delay: 0s; }
.lp-lab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lp-lab button, .lp-seg button {
  min-height: 44px; border-radius: 12px; border: 1px solid #31404e; background: var(--panel);

}
.lp-lab button[aria-pressed="true"], .lp-seg button[aria-pressed="true"] { background: var(--cyan); color: #071014; border-color: var(--cyan); }

.lp-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; grid-column: 1 / -1; }

  const a = document.createElement('span');
  a.textContent = prev;
  const b = document.createElement('span');
  b.textContent = next;
  col.append(a, b);
  wrap.append(col);
  node.append(wrap);

  if (acc.id === 'izzy' && acc.worn.length) {
    const names = acc.worn.map((id) => PIECES.find((item) => item.id === id)?.label).filter(Boolean);
    worn.hidden = false;
    worn.textContent = `Wearing ${names.join(', ')}`;
  } else worn.hidden = true;
}
function paintRows() {
  const list = $('lp-list');
  const quests = S().quests;
  const onQuests = tab === 'quests';
  $('lp-section').hidden = !onQuests;
  list.hidden = !onQuests;
  $('lp-other').hidden = onQuests;
  if (!onQuests) {
    $('lp-other').textContent = OTHER[tab] || '';
    return;
  }
  const have = new Map();
  list.querySelectorAll('.lp-row').forEach((row) => have.set(row.dataset.id, row));
  const keep = new Set();
  for (let i = 0; i < quests.length; i += 1) {
    const q = quests[i];
    keep.add(q.id);
    let row = have.get(q.id);
    if (!row) {
      row = document.createElement('article');
      row.className = 'lp-row';
      row.dataset.id = q.id;
      row.innerHTML = '<div class="lp-row-main"><div class="lp-row-title"></div><div class="lp-row-meta"><span class="lp-own"></span><span class="lp-row-xp">XP</span></div></div><button type="button" class="lp-complete lp-hit"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 4.5"></path></svg></button>';
      row.querySelector('button').addEventListener('click', () => completeQuest(q.id));
      list.append(row);
      if (q.fresh) { row.classList.add('is-new'); q.fresh = false; }
    }
    row.querySelector('.lp-row-title').textContent = q.title;
    row.querySelector('.lp-own').textContent = q.own;
    const btn = row.querySelector('button');
    btn.disabled = q.done;
    btn.setAttribute('aria-label', q.done ? `Completed ${q.title}` : `Complete ${q.title}`);
    row.classList.toggle('is-done', q.done);
  }
  have.forEach((row, id) => { if (!keep.has(id)) row.remove(); });
}
function paintNav() {
  const nav = $('lp-nav');
  nav.replaceChildren();
  for (let i = 0; i < NAV.length; i += 1) {
    const [id, label, d] = NAV[i];
    if (id === 'play' && who === 'izzy') continue;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'lp-hit';
    btn.dataset.tab = id;
    if (tab === id) btn.setAttribute('aria-current', 'page');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('aria-hidden', 'true');
    if (id === 'character') {
      svg.innerHTML = '<circle cx="12" cy="8.4" r="3.1"></circle><path d="M5.6 19.4c1.1-2.8 3.4-4.2 6.4-4.2s5.3 1.4 6.4 4.2"></path>';
    } else if (id === 'more') {
      svg.innerHTML = '<circle cx="6" cy="12" r="1.35" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.35" fill="currentColor" stroke="none"></circle><circle cx="18" cy="12" r="1.35" fill="currentColor" stroke="none"></circle>';
    } else {
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      svg.append(path);
    }
    const span = document.createElement('span');
    span.textContent = label;
    btn.append(svg, span);
    btn.addEventListener('click', () => { tab = id; $('lp-title').textContent = label; paintNav(); paintRows(); });
    nav.append(btn);
  }
}
function paintHero() {
  const host = $('lp-hero');
  if (who !== 'izzy') { host.hidden = true; host.replaceChildren(); return; }
  host.hidden = false;
  drawHero(host, S().worn, null);
}
function paintLab() {
  const open = S().quests.some((q) => !q.done);
  $('lp-act-complete').disabled = !open;
  $('lp-acc-connor').setAttribute('aria-pressed', who === 'connor' ? 'true' : 'false');
  $('lp-acc-izzy').setAttribute('aria-pressed', who === 'izzy' ? 'true' : 'false');
  $('lp-act-sound').setAttribute('aria-checked', soundOn ? 'true' : 'false');
  $('lp-act-sound').setAttribute('aria-pressed', soundOn ? 'true' : 'false');
}
function render() {
  $('lp-title').textContent = tab === 'quests' ? 'Quests' : OTHER[tab] ? tab[0].toUpperCase() + tab.slice(1) : 'Quests';
  if (tab !== 'quests') {
    const names = { home: 'Home', play: 'Play', character: 'Character', more: 'More' };
    $('lp-title').textContent = names[tab];
  }
  paintStatus();
  paintRows();
  paintNav();
  paintHero();
  paintLab();
  applyReduce();
}
function announce(text) {
  const live = $('lp-live');
  live.textContent = '';
  requestAnimationFrame(() => { live.textContent = text; });
}
function setNote(text) {
  const note = $('lp-note');
  note.hidden = !text;
  note.textContent = text || '';
}
function pulse() {
  if (reduced()) return;
  pill.classList.remove('is-hot');
  void pill.offsetWidth;
  pill.classList.add('is-hot');
  clearTimeout(pulse.t);
  pulse.t = setTimeout(() => pill.classList.remove('is-hot'), tune.seal);
}
function pulseFlame() {
  const flame = $('lp-flame');
  if (reduced()) return;
  flame.classList.remove('is-pulse');
  void flame.offsetWidth;
  flame.classList.add('is-pulse');
}
function cancelFlies() {
  for (let i = 0; i < flies.length; i += 1) flies[i]();
  flies.length = 0;
}
function flyXp(fromEl, text, done) {
  if (reduced() || !fromEl) { done(); return () => {}; }
  const node = document.createElement('span');
  node.className = 'lp-fly';
  node.textContent = text;
  document.body.append(node);
  const a = fromEl.getBoundingClientRect();
  const startX = a.left + a.width / 2;
  const startY = a.top + a.height / 2;
  const pillBox = pill.getBoundingClientRect();
  const endX = pillBox.left + pillBox.width / 2;
  const endY = pillBox.bottom - 22;
  node.style.left = `${startX}px`;
  node.style.top = `${startY}px`;
  const dur = tune.fly;
  const t0 = performance.now();
  let raf = 0;
  let dead = false;
  const frame = (now) => {
    if (dead) return;
    const t = Math.min(1, (now - t0) / dur);
    const e = 1 - (1 - t) ** 3;
    const arc = Math.sin(t * Math.PI) * -14;
    node.style.transform = `translate(${(endX - startX) * e}px, ${(endY - startY) * e + arc}px)`;
    if (t < 1) raf = requestAnimationFrame(frame);
    else { cleanup(); done(); }
  };
  function cleanup() { dead = true; cancelAnimationFrame(raf); node.remove(); }
  raf = requestAnimationFrame(frame);
  return cleanup;
}
function land(acc) {
  const item = acc.queue.shift();
  if (!item) return;
  const prev = acc.shown;
  acc.shown = item.snap;
  if (acc.id !== who) return;
  paintStatus();
  pulse();
  if (prev && item.snap.streak > prev.streak) pulseFlame();
  if (item.piece) openSheet(item.piece, item.snap.level);
  else if (item.note) {
    setNote(item.note);
    const spot = relCenter(pill);
    burst(spot.x, spot.y);
    play('level');
    announce(item.note);
  }
  if (pillOpen) startSpring();
}
function enqueue(acc, fromEl, text, extra) {
  acc.queue.push({ snap: snapshot(acc), piece: extra.piece || null, note: extra.note || '', streak: acc.streak });
  if (reduced()) {
    while (acc.queue.length) land(acc);
    return;
  }
  const cancel = flyXp(fromEl, text, () => land(acc));
  flies.push(cancel);
}
function ratioDone(acc) {
  let done = 0;
  for (let i = 0; i < acc.quests.length; i += 1) if (acc.quests[i].done) done += 1;
  return { done, total: acc.quests.length };
}
function applyXp(acc, amount) {
  const before = levelFor(acc.xp).level;
  acc.xp += amount;
  const after = levelFor(acc.xp).level;
  let piece = null;
  if (acc.id === 'izzy' && after > before) {
    for (let lv = before + 1; lv <= after; lv += 1) {
      const found = PIECES.find((item) => item.level === lv);
      if (found && !acc.unlocked.includes(found.id)) {
        acc.unlocked.push(found.id);
        if (!piece) piece = found;
      }
    }
  }
  return { before, after, piece };
}
function markStreak(acc) {
  const now = ratioDone(acc);
  if (now.total > 0 && now.done === now.total && !acc.streakHeld) {
    acc.streak += 1;
    acc.streakHeld = true;
    return true;
  }
  return false;
}
function completeQuest(id) {
  const acc = S();
  const q = acc.quests.find((item) => item.id === id);
  if (!q || q.done) return;
  const before = ratioDone(acc);
  q.done = true;
  const grew = applyXp(acc, q.xp);
  const justClosed = ratioDone(acc).done === ratioDone(acc).total && before.done !== before.total;
  markStreak(acc);
  paintRows();
  paintStatus();
  if (justClosed) {
    const wrap = $('lp-ring-wrap');
    wrap.classList.remove('is-sealed');
    void wrap.offsetWidth;
    wrap.classList.add('is-sealed');
    const spot = relCenter(wrap);
    burst(spot.x, spot.y);
  }
  const row = document.querySelector(`[data-id="${q.id}"] .lp-row-xp`);
  const note = !grew.piece && grew.after > grew.before ? `Level ${grew.after} reached.` : '';
  enqueue(acc, row, `+${q.xp} XP`, { piece: grew.piece, note });
  play('check');
  announce(`Completed ${q.title}. +${q.xp} XP.`);
  paintLab();
  if (grew.piece) announce(`Level ${grew.after} reached. ${grew.piece.label} unlocked. Not worn until you tap Wear.`);
}
function firstOpen() { return S().quests.find((q) => !q.done); }
function assignQuest() {
  const acc = S();
  const pool = ASSIGN[acc.id];
  const spec = pool[acc.assignI % pool.length];
  acc.assignI += 1;
  const q = quest(`${acc.id}-a${questSeq += 1}`, spec[0], spec[1], spec[2]);
  q.fresh = true;
  acc.quests.unshift(q);
  const text = `${acc.partner} sent you: ${q.title}`;
  showToast(text);
  render();
  announce(text);
}
function showToast(text) {
  clearTimeout(toastTimer);
  toast.hidden = false;
  toast.classList.remove('is-in', 'is-out');
  toast.textContent = text;
  toast.setAttribute('title', text);
  if (reduced()) { toast.classList.add('is-in'); }
  else requestAnimationFrame(() => toast.classList.add('is-in'));
  toastTimer = setTimeout(hideToast, 3200);
}
function hideToast() {
  if (toast.hidden) return;
  toast.classList.remove('is-in');
  toast.classList.add('is-out');
  const done = () => { toast.hidden = true; toast.classList.remove('is-out'); };
  if (reduced()) done();
  else toast.addEventListener('transitionend', done, { once: true });
}
function gain(amount) {
  const acc = S();
  cancelFlies();
  acc.queue = [];
  const grew = applyXp(acc, amount);
  acc.shown = snapshot(acc);
  const note = !grew.piece && grew.after > grew.before ? `Level ${grew.after} reached.` : '';
  render();
  pulse();
  if (grew.piece) {
    openSheet(grew.piece, grew.after);
    announce(`Level ${grew.after} reached. ${grew.piece.label} unlocked. Not worn until you tap Wear.`);
  } else if (note) {
    setNote(note);
    const spot = relCenter(pill);
    burst(spot.x, spot.y);
    play('level');
    announce(note);
  } else announce(`+${amount} XP.`);
  if (pillOpen) startSpring();
}
function levelUp() {
  const acc = S();
  const lvl = levelFor(acc.xp);
  gain(Math.max(1, lvl.xpForNext - lvl.xpIntoLevel));
}
function wear(id) {
  const acc = S();
  if (!acc.unlocked.includes(id)) return;
  if (!acc.worn.includes(id)) acc.worn.push(id);
  const piece = PIECES.find((item) => item.id === id);
  closeSheet();
  paintedGear = '';
  render();
  announce(piece ? `Wearing ${piece.label}.` : 'Wearing gear.');
}
function takeOff(id) {
  const acc = S();
  acc.worn = acc.worn.filter((item) => item !== id);
  paintedGear = '';
  render();
}
function openSheet(piece, level) {
  sheetGen += 1;
  const gen = sheetGen;
  setLab(false);
  sheetPiece = piece;
  $('lp-sheet-title').textContent = `Level ${level} reached.`;
  $('lp-sheet-road').textContent = 'The road remembers every step.';
  $('lp-sheet-gear').textContent = `New gear unlocked: ${piece.label}.`;
  $('lp-sheet-reveal').textContent = REVEAL;
  const preview = S().worn.filter((id) => id !== piece.id);
  drawHero($('lp-sheet-hero'), preview, piece);
  $('lp-wear').textContent = 'Wear';
  $('lp-wear').setAttribute('aria-label', `Wear ${piece.label}`);
  restoreFocus = document.activeElement;
  sheet.hidden = false;
  scrim.hidden = false;
  sheet.classList.remove('is-out');
  $('lp-main').inert = true;
  $('lp-nav').inert = true;
  if (reduced()) sheet.classList.add('is-in');
  else requestAnimationFrame(() => sheet.classList.add('is-in'));
  $('lp-wear').focus();
  const fire = () => {
    const spot = relCenter($('lp-sheet-hero'));
    burst(spot.x, spot.y);
    play('unlock');
  };
  if (reduced()) fire();
  else sheet.addEventListener('transitionend', function once(event) {
    if (gen !== sheetGen || event.target !== sheet || event.propertyName !== 'transform') return;
    sheet.removeEventListener('transitionend', once);
    fire();
  });
}
function closeSheet() {
  if (sheet.hidden) return;
  const gen = sheetGen;
  sheet.classList.remove('is-in');
  sheet.classList.add('is-out');
  let closed = false;
  const done = () => {
    if (closed || gen !== sheetGen) return;
    closed = true;
    sheet.hidden = true;
    scrim.hidden = true;
    sheet.classList.remove('is-out');
    $('lp-main').inert = false;
    $('lp-nav').inert = false;
    sheetPiece = null;
    if (restoreFocus && restoreFocus.focus) restoreFocus.focus();
  };
  if (reduced()) done();
  else {
    sheet.addEventListener('transitionend', done, { once: true });
    setTimeout(done, tune.sheet + 80);
  }
}
function setWho(id) {
  if (!accounts[id]) return;
  cancelFlies();
  accounts[who].queue = [];
  accounts[who].shown = snapshot(accounts[who]);
  clearTimeout(toastTimer);
  toast.hidden = true;
  toast.classList.remove('is-in', 'is-out');
  sheetGen += 1;
  sheet.hidden = true;
  scrim.hidden = true;
  sheet.classList.remove('is-in', 'is-out');
  $('lp-main').inert = false;
  $('lp-nav').inert = false;
  sheetPiece = null;
  who = id;
  if (tab === 'play' && id === 'izzy') tab = 'quests';
  paintedGear = '';
  setNote('');
  pillOpen = false;
  morph.tp = 0;
  morph.p = 0;
  render();
  applyRest();
  announce(id === 'izzy' ? 'Izzy. Play is hidden.' : 'Connor. Play is in the nav.');
}
function resetAccount() {
  cancelFlies();
  closeSheet();
  accounts[who] = who === 'connor' ? freshConnor() : freshIzzy();
  paintedGear = '';
  setNote('');
  pillOpen = false;
  morph.p = 0;
  morph.tp = 0;
  tab = 'quests';
  render();
  applyRest();
  announce(`${S().name} reset.`);
}
function setLab(open) {
  labOpen = open;
  $('lp-lab').classList.toggle('is-open', open);
  $('lp-lab-toggle').setAttribute('aria-expanded', open ? 'true' : 'false');
}
function bootHash() {
  const bits = new Set(location.hash.slice(1).split(/[&,]/).filter(Boolean));
  if (bits.has('reduce')) reduceOverride = true;
  if (bits.has('izzy') || bits.has('sheet')) who = 'izzy';
  if (bits.has('reduce')) {
    const acc = S();
    const q = acc.quests.find((item) => !item.done);
    if (q) { q.done = true; applyXp(acc, q.xp); markStreak(acc); acc.shown = snapshot(acc); }
  }
  if (bits.has('closed')) {
    who = 'connor';
    const acc = accounts.connor;
    for (let i = 0; i < acc.quests.length; i += 1) {
      if (!acc.quests[i].done) { acc.quests[i].done = true; applyXp(acc, acc.quests[i].xp); }
    }
    markStreak(acc);
    acc.shown = snapshot(acc);
  }
  if (bits.has('toast')) {
    const acc = S();
    const spec = ASSIGN[acc.id][0];
    const q = quest(`${acc.id}-toast`, spec[0], spec[1], spec[2]);
    acc.quests.unshift(q);
    acc.shown = snapshot(acc);
  }
  if (bits.has('sheet')) {
    const acc = accounts.izzy;
    acc.xp = 10;
    acc.unlocked = ['fingerless-gloves'];
    acc.worn = [];
    acc.shown = snapshot(acc);
  }
  if (bits.has('expanded')) { pillOpen = true; morph.tp = 1; morph.p = 1; }
  render();
  applyRest();
  if (bits.has('toast')) showToast(`${S().partner} sent you: ${ASSIGN[S().id][0][0]}`);
  if (bits.has('sheet')) openSheet(PIECES[0], 2);
  if (bits.has('expanded')) setPill(true);
}

$('lp-lab-toggle').addEventListener('click', () => setLab(!labOpen));
$('lp-act-complete').addEventListener('click', () => { const q = firstOpen(); if (q) { tab = 'quests'; completeQuest(q.id); } });
$('lp-act-assign').addEventListener('click', () => { tab = 'quests'; assignQuest(); });
$('lp-act-xp').addEventListener('click', () => gain(10));
$('lp-act-level').addEventListener('click', levelUp);
$('lp-act-reduce').addEventListener('click', () => {
  reduceOverride = !reduced();
  applyReduce();
  if (reduced()) { cancelFlies(); S().queue = []; S().shown = snapshot(S()); render(); applyRest(); }
  announce(reduced() ? 'Reduced motion on.' : 'Reduced motion off.');
});
$('lp-act-sound').addEventListener('click', () => {
  soundOn = !soundOn;
  paintLab();
  announce(soundOn ? 'Sound on.' : 'Sound off.');
  if (soundOn) play('check');
});
$('lp-acc-connor').addEventListener('click', () => setWho('connor'));
$('lp-acc-izzy').addEventListener('click', () => setWho('izzy'));
$('lp-act-reset').addEventListener('click', resetAccount);
toggle.addEventListener('click', () => setPill(!pillOpen));
$('lp-wear').addEventListener('click', () => { if (sheetPiece) wear(sheetPiece.id); });
$('lp-later').addEventListener('click', closeSheet);
scrim.addEventListener('click', closeSheet);
toast.addEventListener('click', hideToast);
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  if (!sheet.hidden) { closeSheet(); return; }
  if (pillOpen) { setPill(false); return; }
  if (labOpen) setLab(false);
});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', () => { if (reduceOverride === null) applyReduce(); });
new ResizeObserver(() => { if (!morph.running) applyRest(); }).observe(phone);
$('lp-today').style.strokeDasharray = String(C_TODAY);
$('lp-xp-arc').style.strokeDasharray = String(C_XP);
mountPane();
bootHash();
window.__lp = { tune, accounts, levelFor, burst, sampleLinear, reduced: () => reduced() };
</script>
